<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task_2</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div>
        <form action="">
            <h1>Checkbox example</h1>
            <h3>Choose languages</h3>
            <label for="English">English
                <input type="checkbox" id="English" name="Language" value="English">
            </label>

            <label for="Hindi">Hindi
                <input type="checkbox" id="Hindi" name="Language" value="Hindi">
            </label>

            <label for="German">German
                <input type="checkbox" id="German" name="Language" value="German">
            </label>

            <label for="French">French
                <input type="checkbox" id="French" name="Language" value="French">
            </label>
        </form>
    </div>
</body>
</html>
