<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ev_isi</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="./Parade logo.png">
</head>
<body>
    <div>
    <img src="./Parade logo.png" alt="Parade_logo">
    <h1>Welcome to the Parade Andrea!</h1>
    <h4>One more thing: How did you hear about us?</h4>
    </div>

    <form action="">
    
        <label for="Press/ News Article">
            <input type="radio" id="">Press/ News paper
        </label>

        <label for="Facebook">
            <input type="radio">Facebook
        </label>

        <label for="Tiktok">
            <input type="radio">Tiktok
        </label>
        
        <label for="Twitter">
            <input type="radio" id="Twitter" value="Twitter" name="Twitter">Twitter
        </label>

        <label for="Word of Mouth">
            <input type="radio" id="Word of Mouth" value="Word of Mouth" name="Word of Mouth">Word of Mouth
        </label>

        <label for="Podcast">
            <input type="radio" id="Podcast" value="Podcast" name="Podcast">Podcast
        </label>

        <label for="Youtube">
            <input type="radio" id="Youtube" value="Youtube" name="Youtube">Youtube
        </label>

        <label for="Newsletter">
            <input type="radio" id="Newsletter" value="Newsletter" name="Newsletter">Newsletter
        </label>

        <label for="Instagram">
            <input type="radio" id="Instagram" value="Instagram" name="Instagram">Instagram
        </label>

        <label for="Billboard/Wild postings">
            <input type="radio" id="Billboard/Wild postings" value="Billboard/Wild postings" name="Billboard/Wild postings">Billboard/Wild postings
        </label>

        <label for="Search Engine">
            <input type="radio" id="Search Engine" value="Search Engine" name="Search Engine">Search Engine
        </label>

        <label for="Event">
            <input type="radio" id="Event" value="Event" name="Event">Event
        </label>

        <button type="">Submit</button>

    </form>

</html>
