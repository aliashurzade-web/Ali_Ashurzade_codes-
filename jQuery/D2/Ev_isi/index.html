<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jQuery Effects</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
  <h1>jQuery Effects</h1>

  <main class="grid">
    <!-- Row 1 -->
    <section class="card toggle">
      <div class="box" id="box-toggle"><h2>Toggle</h2></div>
      <button class="btn" id="btn-toggle">Hide</button>
    </section>

    <section class="card fade">
      <div class="box" id="box-fade"><h2>Fade</h2></div>
      <button class="btn" id="btn-fade">Fade out</button>
    </section>

    <section class="card fadeto">
      <div class="box" id="box-fadeto"><h2>Fade To</h2></div>
      <button class="btn" id="btn-fadeto">Fade to 25%</button>
    </section>

    <section class="card slide">
      <div class="box" id="box-slide"><h2>Slide</h2></div>
      <button class="btn" id="btn-slide">Slide down</button>
    </section>
  </main>

  
  <script src="script.js"></script>
</body>
</html>
