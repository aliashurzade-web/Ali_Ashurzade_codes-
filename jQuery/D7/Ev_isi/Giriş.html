<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">  
    <title>Qeydiyyat və Giriş</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        
        <!-- Qeydiyyat Kartı -->
        <div class="card shadow-lg p-4 form-box" id="qeydiyyatKarti">
            <h2 class="text-center text-primary mb-4">Qeydiyyat kartı</h2>

            <form id="qeydiyyatFormu">
                <div class="mb-3">
                    <label class="form-label text-muted">Adınızı daxil edin:</label>
                    <input type="text" id="adInput" class="form-control" placeholder="Adınızı daxil edin" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Emailinizi daxil edin:</label>
                    <input type="email" id="emailInput" class="form-control" placeholder="Emailinizi daxil edin" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Şifrənizi daxil edin:</label>
                    <input type="password" id="şifrəInput" class="form-control" placeholder="Şifrənizi daxil edin" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Şifrənizi yenidən daxil edin:</label>
                    <input type="password" id="təkrarŞifrəInput" class="form-control" placeholder="Şifrənizi yenidən daxil edin" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Yaşınızı daxil edin:</label>
                    <input type="number" id="yaşInput" class="form-control" placeholder="Yaşınızı daxil edin" min="18" required>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold">Qeydiyyatdan Keç</button>
            </form>

            <p class="text-center mt-3">Artıq hesabınız var? O zaman <button id="qeydiyyatBtn" class="btn btn-link p-0">buradan</button> daxil olun</p>  
        </div>   

        <!-- Giriş Kartı -->
        <div class="card shadow-lg p-4 form-box d-none" id="girişKartı">
            <h2 class="text-center text-success mb-4">Giriş ekranı</h2>

            <form id="signUp">
                <div class="mb-3">
                    <label class="form-label text-muted">Emailinizi daxil edin:</label>
                    <input type="email" id="qeydiyyatEmail" class="form-control" placeholder="Emailinizi daxil edin" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Şifrənizi daxil edin:</label>
                    <input type="password" id="qeydiyyatŞifrə" class="form-control" placeholder="Şifrənizi daxil edin" required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="şifrəGösdər">
                    <label class="form-check-label" for="şifrəGösdər">Show password</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold">Daxil ol</button>
            </form>

            <p class="text-center mt-3">Hesabın yoxdur? O zaman <button id="signUpBtn" class="btn btn-link p-0">buradan</button> qeydiyyatdan keç</p>
        </div>

    </div>

    <script src="./script.js"></script>
</body>
</html>
